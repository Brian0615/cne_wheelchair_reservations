name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*', 'v*.*.*-dev' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read
  actions: read
  packages: read

jobs:

  snyk:
    name: Snyk Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@v1
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest --cov=api --cov=ui --cov=common --cov-report=html --cov-report=xml --junitxml=test-results.xml tests/

  build_and_push:
    name: Build and Push Docker
    needs: [ snyk, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine if images should be pushed
        id: should_push
        run: |
          if [[ "${{ github.event_name }}" == "release" || "${{ github.ref }}" == refs/tags/* || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Log into Docker Hub
        if: steps.should_push.outputs.value == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version from version.py
        id: extract_version
        run: |
          # Read APP_VERSION from version.py
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"?\K[^"]+' version.py)
          
          # Check if this is a tag push
          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG_NAME" == *-dev ]]; then
              VERSION_TAG="${VERSION}-dev"
            else
              VERSION_TAG="${VERSION}"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            # For release events, use GITHUB_REF_NAME instead
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "$TAG_NAME" == *-dev ]]; then
              VERSION_TAG="${VERSION}-dev"
            else
              VERSION_TAG="${VERSION}"
            fi
          else
            VERSION_TAG=""
          fi
          
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "Extracted version: $VERSION, Tag: $VERSION_TAG"

      - name: Extract Docker metadata for API
        id: meta_api
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cne_api
          tags: |
            type=raw,value=latest-${{ github.ref_name }},enable=${{ contains(github.ref, 'refs/heads/') }}
            type=raw,value=${{ env.VERSION_TAG }},enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.should_push.outputs.value == 'true' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          file: api.Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for UI
        id: meta_ui
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cne_ui
          tags: |
            type=raw,value=latest-${{ github.ref_name }},enable=${{ contains(github.ref, 'refs/heads/') }}
            type=raw,value=${{ env.VERSION_TAG }},enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.should_push.outputs.value == 'true' }}
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          file: ui.Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_ecs:
    name: Deploy to ECS
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment
