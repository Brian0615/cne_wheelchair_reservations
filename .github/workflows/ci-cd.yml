name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*', 'v*.*.*-dev' ]
  pull_request:

permissions:
  contents: read

jobs:

  snyk:
    name: Snyk Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      API_HOST: localhost
      API_PORT: 9999
      AUTH_CONFIG_PATH: /fake_auth_config.yml
      AUTH_METHOD: local
      AWS_ACCESS_KEY_ID: FAKE_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: FAKE_SECRET_ACCESS_KEY
      AWS_DEFAULT_REGION: us-east-2
      CNE_YEAR: 2025
      PDF_PASSWORD: fakepassword123
      S3_BUCKET: fake-s3-bucket
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s ./tests -t .

  build_and_push:
    name: Build and Push Docker
    needs: test
    runs-on: ubuntu-latest
    # Only run this job for pushes to develop/main branches and tags
    if: github.event_name == 'push' && (contains(github.ref, 'refs/heads/develop') || contains(github.ref, 'refs/heads/main') || contains(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version from version.py
        id: extract_version
        run: |
          VERSION=$(grep -oP 'APP_VERSION = "\K[^"]+' version.py)
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            VERSION_TAG="${VERSION}-dev"
          else
            VERSION_TAG="${VERSION}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "Extracted version: $VERSION, Tag: $VERSION_TAG"

      - name: Extract Docker metadata for API
        id: meta_api
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cne_api
          tags: |
            type=raw,value=latest-${{ github.ref_name }},enable=${{ contains(github.ref, 'refs/heads/') }}
            type=raw,value=${{ env.VERSION_TAG }},enable=true

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          file: api.Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for UI
        id: meta_ui
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cne_ui
          tags: |
            type=raw,value=latest-${{ github.ref_name }},enable=${{ contains(github.ref, 'refs/heads/') }}
            type=raw,value=${{ env.VERSION_TAG }},enable=true

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          file: ui.Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_ecs:
    name: Deploy to ECS
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment
